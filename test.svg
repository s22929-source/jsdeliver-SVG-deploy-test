<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xhtml="http://www.w3.org/1999/xhtml"
     width="100%" height="100%">
  <foreignObject width="100%" height="100%">
    <xhtml:html>
      <xhtml:body style="margin:0">
        <xhtml:h1>Hello!</xhtml:h1>
        <xhtml:p>This is HTML inside an SVG.</xhtml:p>
      </xhtml:body>
    </xhtml:html>
  </foreignObject>
</svg>
